<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07080b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Aperture</title>
<style>
  :root {
    --bg: #07080b; --ink: #e8e2d6; --muted: #9a9286; --dim: #6d675e;
    --line: rgba(232, 226, 214, 0.16); --silver: #d7dde8; --warm: #c4a574;
    --serif: Georgia, "Iowan Old Style", Palatino, serif;
    --sans: system-ui, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--sans); min-height: 100vh; }
  button, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .app { max-width: 760px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header, .tabs { display: flex; align-items: center; gap: 8px; padding: 16px 18px; }
  header { justify-content: space-between; letter-spacing: 0.22em; text-transform: uppercase; font-size: 11px; color: var(--dim); }
  header b { color: var(--ink); letter-spacing: 0.28em; }
  .status { color: var(--warm); letter-spacing: 0.06em; }
  main { flex: 1; padding: 8px 18px 28px; }
  .ring {
    width: 168px; height: 168px; margin: 12px auto 18px; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 46%, rgba(255,255,255,0.9) 0 2px, transparent 3px),
      radial-gradient(circle at 50% 50%, transparent 42%, rgba(210,222,236,0.2) 46%, rgba(210,222,236,0.7) 49%, transparent 53%);
    box-shadow: 0 0 70px rgba(190, 210, 230, 0.14);
  }
  h1 { font-family: var(--serif); font-weight: 450; font-size: 40px; letter-spacing: -0.03em; margin: 0 0 10px; }
  .lede, .echo, .entry p { font-family: var(--serif); }
  .lede { font-size: 18px; line-height: 1.45; color: var(--muted); margin: 0 0 18px; }
  .echo { font-size: 22px; line-height: 1.4; color: var(--silver); margin: 14px 0; }
  .card { border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin: 12px 0; background: rgba(255,255,255,0.02); }
  label { display: block; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  textarea, input[type="text"] {
    width: 100%; background: transparent; border: none; outline: none; resize: vertical;
    font-family: var(--serif); font-size: 20px; line-height: 1.4;
  }
  textarea { min-height: 90px; }
  .hint { color: var(--dim); font-size: 13px; line-height: 1.45; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .primary, .secondary, .ghost { border-radius: 999px; padding: 14px 18px; border: 1px solid var(--line); font-size: 15px; }
  .primary { background: var(--ink); color: #12130f; border-color: var(--ink); }
  .secondary, .ghost { background: transparent; color: var(--ink); }
  .ghost { padding: 8px 12px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .tabs { position: sticky; bottom: 0; background: #07080b; border-top: 1px solid var(--line); padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .tabs button { flex: 1; background: transparent; border: none; color: var(--dim); padding: 12px 2px; letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }
  .tabs button.on { color: var(--ink); }
  .entry { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .entry time, .chapter { color: var(--dim); font-size: 12px; letter-spacing: 0.04em; }
  .entry p { font-size: 18px; line-height: 1.45; margin: 8px 0; }
  .left { color: var(--muted); }
  .stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .word { display: inline-block; margin: 4px 6px 0 0; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--silver); font-size: 13px; }
  .flash { margin: 8px 0 0; color: var(--warm); font-size: 14px; min-height: 1.2em; }
  .chapter-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<div class="app">
  <header>
    <b>Aperture</b>
    <span class="status" id="status">starting</span>
    <button class="ghost" type="button" data-act="export">Export</button>
  </header>
  <main id="main"></main>
  <nav class="tabs">
    <button type="button" data-act="view" data-view="room">Room</button>
    <button type="button" data-act="view" data-view="chapters">Chapters</button>
    <button type="button" data-act="view" data-view="record">Record</button>
    <button type="button" data-act="view" data-view="pattern">Pattern</button>
    <button type="button" data-act="view" data-view="creed">Creed</button>
  </nav>
</div>
<noscript><p style="padding:24px;font-family:Georgia,serif;font-size:20px">Open this file in Chrome. The chat preview does not run the room.</p></noscript>
<script>
(function () {
  var KEY = "aperture.v2";
  var stop = {};
  "a an the and or but if to of in on for with at from by as is was were be been being it this that those these i you we they he she my your our their me him her us them not no yes just so very really into about than then there here what when who how why will would can could should did do does done have has had".split(" ").forEach(function (w) { stop[w] = 1; });
  var state = load();
  var view = state.seen ? "room" : "welcome";
  var note = "";

  function load() {
    try {
      var raw = localStorage.getItem(KEY) || localStorage.getItem("aperture.v1");
      if (!raw) return fresh();
      var data = JSON.parse(raw);
      if (!data.entries) data.entries = [];
      if (!data.chapters) data.chapters = [];
      return data;
    } catch (err) { return fresh(); }
  }
  function fresh() { return { seen: false, name: "", entries: [], chapters: [], openChapter: "" }; }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (err) { note = "This browser blocked saving. Open the file in Chrome."; }
  }
  function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function when(ts) { try { return new Date(ts).toLocaleString(); } catch (err) { return ""; } }
  function tokens(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9'\s]/g, " ").split(/\s+/).filter(function (w) {
      return w.length > 2 && !stop[w];
    });
  }
  function lastSentence(s) {
    var text = String(s || "").replace(/\s+/g, " ").trim();
    if (!text) return "";
    var bits = text.split(/[.!?]/);
    var i = bits.length - 1;
    while (i >= 0 && !bits[i].trim()) i -= 1;
    return i >= 0 ? bits[i].trim() : text;
  }
  function similar(text, prior) {
    var mine = tokens(text);
    var set = {};
    mine.forEach(function (w) { set[w] = 1; });
    if (!mine.length) return "";
    var best = "", score = 0;
    prior.forEach(function (e) {
      var other = tokens(e.real);
      if (!other.length) return;
      var hit = 0, seen = {};
      other.forEach(function (w) { seen[w] = 1; if (set[w]) hit += 1; });
      var union = mine.length;
      Object.keys(seen).forEach(function (w) { if (!set[w]) union += 1; });
      var j = union ? hit / union : 0;
      if (j > score) { score = j; best = lastSentence(e.real); }
    });
    return score >= 0.18 ? best : "";
  }
  function openName() {
    var id = state.openChapter;
    var found = "";
    state.chapters.forEach(function (c) { if (c.id === id && !c.closed) found = c.name; });
    return found;
  }

  function welcome() {
    return '<section><div class="ring"></div><h1>Aperture</h1>' +
      '<p class="lede">A private room. It keeps what you made real, and what you left unreal on purpose. It does not advise you.</p>' +
      '<div class="card"><label for="name">What should the room call you</label>' +
      '<input id="name" type="text" maxlength="40" placeholder="A name, or leave it blank" /></div>' +
      '<div class="row"><button class="primary" type="button" data-act="enter">Enter the room</button></div>' +
      '<p class="flash">' + esc(note) + '</p></section>';
  }
  function room() {
    var last = state.entries[0];
    var echo = last ? lastSentence(last.real) : "The room is empty. That is allowed.";
    var chapter = openName();
    return '<section><div class="ring"></div>' +
      '<p class="hint" style="letter-spacing:.14em;text-transform:uppercase">' + esc(chapter || "No open chapter") + '</p>' +
      '<p class="echo">' + esc(echo) + '</p>' +
      '<div class="card"><label for="real">What became real</label><textarea id="real" placeholder="The thing that happened, or the choice you actually took."></textarea></div>' +
      '<div class="card"><label for="left">What you left unreal on purpose</label><textarea id="left" placeholder="The road you did not take."></textarea>' +
      '<p class="hint">Kept on this device only. If it resembles an older entry, the room quotes that older line.</p></div>' +
      '<div class="row"><button class="primary" type="button" data-act="keep">Keep this</button><button class="secondary" type="button" data-act="speak">Speak</button></div>' +
      '<p class="flash" id="flash">' + esc(note) + '</p></section>';
  }
  function chapters() {
    var rows = state.chapters.map(function (c) {
      var n = state.entries.filter(function (e) { return e.chapterId === c.id; }).length;
      return '<div class="chapter-row"><div><b>' + esc(c.name) + '</b><div class="hint">' + n + ' kept' + (c.closed ? " · closed" : " · open") + '</div></div>' +
        (c.closed ? '<button class="ghost" type="button" data-act="reopen" data-id="' + esc(c.id) + '">Reopen</button>' : '<button class="ghost" type="button" data-act="close" data-id="' + esc(c.id) + '">Close</button>') +
        '</div>';
    }).join("");
    return '<section><h1>Chapters</h1><p class="lede">A chapter is a stretch of a life you are willing to name. Entries belong to the open one. Closing it does not delete it.</p>' +
      '<div class="card"><label for="chapter">Name the next stretch</label><input id="chapter" type="text" maxlength="60" placeholder="After the porch light. Before the grant." /></div>' +
      '<div class="row"><button class="primary" type="button" data-act="chapter">Open chapter</button></div>' +
      (rows || '<p class="hint">No chapters yet. The room still keeps entries.</p>') +
      '<p class="flash">' + esc(note) + '</p></section>';
  }
  function record() {
    if (!state.entries.length) return '<section><h1>No record yet</h1><p class="lede">Room. One true line. Keep this.</p></section>';
    return '<section><p class="hint">Record · ' + state.entries.length + '</p>' + state.entries.map(function (e) {
      return '<article class="entry"><time>' + esc(when(e.ts)) + (e.chapter ? " · " + esc(e.chapter) : "") + '</time><p>' + esc(e.real) + '</p>' +
        (e.left ? '<p class="left">Left unreal: ' + esc(e.left) + '</p>' : '') +
        (e.echo ? '<p class="hint">Older self: ' + esc(e.echo) + '</p>' : '') + '</article>';
    }).join("") + '</section>';
  }
  function pattern() {
    var counts = {}, leftN = 0;
    state.entries.forEach(function (e) {
      if (e.left && String(e.left).trim()) leftN += 1;
      tokens((e.real || "") + " " + (e.left || "")).forEach(function (w) { counts[w] = (counts[w] || 0) + 1; });
    });
    var words = Object.keys(counts).filter(function (w) { return counts[w] > 1; }).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 18);
    return '<section><h1>The shape of your choosing</h1><p class="lede">A life is not everything that was possible. It is what remained after you refused the rest.</p>' +
      '<div class="stat"><span>Entries kept</span><b>' + state.entries.length + '</b></div>' +
      '<div class="stat"><span>Refusals named</span><b>' + leftN + '</b></div>' +
      '<div class="stat"><span>Chapters named</span><b>' + state.chapters.length + '</b></div>' +
      '<div class="card"><label>Words that keep returning</label>' +
      (words.length ? words.map(function (w) { return '<span class="word">' + esc(w) + ' · ' + counts[w] + '</span>'; }).join("") : '<p class="hint">Not enough yet. Repetition is how a self becomes visible.</p>') +
      '</div><p class="hint">No score. No streak. A gap is not a failure.</p></section>';
  }
  function creed() {
    return '<section><h1>Creed</h1><p class="lede">Most software is a mouth. Aperture is a margin. It sits beside the day and does not take it.</p>' +
      '<p class="lede">The room will not tell you who to be. It will show you who you have already been choosing. Its only intelligence is your earlier self.</p>' +
      '<p class="lede">Share the link, not the record. Export is the whole archive.</p>' +
      '<div class="row"><button class="secondary" type="button" data-act="import">Import archive</button><button class="secondary" type="button" data-act="wipe">Erase this room</button></div>' +
      '<input id="file" type="file" accept="application/json" style="display:none" />' +
      '<p class="flash">' + esc(note) + '</p></section>';
  }

  function render() {
    var html = view === "welcome" ? welcome() : view === "chapters" ? chapters() : view === "record" ? record() : view === "pattern" ? pattern() : view === "creed" ? creed() : room();
    document.getElementById("main").innerHTML = html;
    var tabs = document.querySelectorAll(".tabs button");
    for (var i = 0; i < tabs.length; i++) tabs[i].className = tabs[i].getAttribute("data-view") === view ? "on" : "";
    document.getElementById("status").textContent = "live · " + state.entries.length;
  }
  function onAct(act, node) {
    if (act === "view") {
      view = node.getAttribute("data-view");
      if (!state.seen && view === "room") view = "welcome";
      note = "";
      render();
      return;
    }
    if (act === "enter") {
      var nameEl = document.getElementById("name");
      state.name = nameEl && nameEl.value.trim() ? nameEl.value.trim() : "you";
      state.seen = true;
      save();
      note = "";
      view = "room";
      render();
      return;
    }
    if (act === "keep") {
      var realEl = document.getElementById("real");
      var leftEl = document.getElementById("left");
      var real = realEl ? realEl.value.trim() : "";
      var left = leftEl ? leftEl.value.trim() : "";
      if (!real && !left) { note = "Write one line first, then tap Keep this."; render(); return; }
      state.entries.unshift({ ts: Date.now(), real: real, left: left, echo: similar(real + " " + left, state.entries), chapter: openName(), chapterId: state.openChapter || "" });
      save();
      note = "Kept.";
      view = "record";
      render();
      return;
    }
    if (act === "chapter") {
      var box = document.getElementById("chapter");
      var name = box ? box.value.trim() : "";
      if (!name) { note = "Name the stretch first."; render(); return; }
      var id = String(Date.now());
      state.chapters.forEach(function (c) { c.closed = true; });
      state.chapters.unshift({ id: id, name: name, closed: false, ts: Date.now() });
      state.openChapter = id;
      save();
      note = "Chapter open.";
      render();
      return;
    }
    if (act === "close" || act === "reopen") {
      var id = node.getAttribute("data-id");
      state.chapters.forEach(function (c) {
        if (act === "reopen") c.closed = c.id !== id;
        else if (c.id === id) c.closed = true;
      });
      state.openChapter = act === "reopen" ? id : "";
      save();
      note = act === "reopen" ? "Reopened." : "Closed. The entries stay.";
      render();
      return;
    }
    if (act === "speak") {
      var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec) { note = "This browser has no speech input. Type instead."; render(); return; }
      var rec = new Rec();
      rec.lang = "en-US";
      rec.onresult = function (ev) {
        var field = document.getElementById("real");
        if (!field) return;
        field.value = (field.value ? field.value + " " : "") + ev.results[0][0].transcript;
      };
      rec.onerror = function () { note = "Microphone was blocked."; render(); };
      rec.start();
      note = "Listening.";
      var flash = document.getElementById("flash");
      if (flash) flash.textContent = note;
      return;
    }
    if (act === "export") {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "aperture-archive.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      note = "Archive download started.";
      render();
      return;
    }
    if (act === "import") {
      var file = document.getElementById("file");
      if (file) file.click();
      return;
    }
    if (act === "wipe") {
      if (!window.confirm("Erase the room on this device? Export first if the record matters.")) return;
      state = fresh();
      save();
      note = "Room erased.";
      view = "welcome";
      render();
    }
  }
  document.addEventListener("click", function (ev) {
    var node = ev.target;
    while (node && node !== document && !node.getAttribute("data-act")) node = node.parentNode;
    if (!node || node === document) return;
    ev.preventDefault();
    onAct(node.getAttribute("data-act"), node);
  });
  document.addEventListener("change", function (ev) {
    if (!ev.target || ev.target.id !== "file" || !ev.target.files || !ev.target.files[0]) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !data.entries) throw new Error("bad");
        if (!window.confirm("Replace the room on this device with the archive?")) return;
        if (!data.chapters) data.chapters = [];
        state = data;
        state.seen = true;
        save();
        note = "Archive imported.";
        view = "record";
        render();
      } catch (err) { note = "That file is not an Aperture archive."; render(); }
    };
    reader.readAsText(ev.target.files[0]);
  });
  render();
})();
</script>
</body>
</html>
