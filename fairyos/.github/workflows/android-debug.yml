name: Build SparkX Master APK

on:
  push:
    branches: [ main ]
    paths:
      - 'fairyos/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: fairyos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.9

    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SparkX-Master-debug-apk
        path: fairyos/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: SparkX-Master-release-apk
        path: fairyos/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
