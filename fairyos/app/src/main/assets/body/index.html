<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ara Body</title>
<style>
html, body { margin: 0; height: 100%; background: #05070e; overflow: hidden; }
canvas { width: 100%; height: 100%; display: block; }
#status { position: absolute; top: 12px; left: 12px; color: #b9dcff; font: 14px system-ui; text-shadow: 0 1px 4px #000; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.166.1/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/" } }
</script>
</head>
<body>
<div id="status">Loading high-quality body…</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const status = document.getElementById("status");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070e);
scene.fog = new THREE.Fog(0x05070e, 3.5, 14);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 40);
camera.position.set(0, 1.3, 2.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.05, 0);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xb9dcff, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(1.5, 2.5, 1.8);
scene.add(key);
const rim = new THREE.DirectionalLight(0x7ec8ff, 0.9);
rim.position.set(-2, 1.2, -1);
scene.add(rim);

const loader = new GLTFLoader();
const urls = [
  "ara-body-new.glb",
  "ara-body.glb"
];
function tryLoad(i) {
  if (i >= urls.length) { status.textContent = "No body found"; return; }
  loader.load(urls[i], (gltf) => {
    const model = gltf.scene;
    model.traverse(c => {
      if (c.isMesh && c.material) {
        if (c.material.metalness !== undefined) c.material.metalness = Math.max(c.material.metalness, 0.55);
        if (c.material.roughness !== undefined) c.material.roughness = Math.min(c.material.roughness, 0.45);
      }
    });
    scene.add(model);
    const mixer = new THREE.AnimationMixer(model);
    const idle = gltf.animations.find(c => /idle/i.test(c.name)) || gltf.animations[0];
    if (idle) mixer.clipAction(idle).play();
    status.textContent = urls[i].includes("new") ? "High-quality body" : "Legacy body";
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      mixer.update(clock.getDelta());
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  }, undefined, () => tryLoad(i + 1));
}
tryLoad(0);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
